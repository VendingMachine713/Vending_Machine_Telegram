name: VM Ecosystem CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install developer tools
        run: python -m pip install ruff
      - name: Compile
        run: python -m compileall -q shared bots/Admin_Command_Centre bots/Universal_Search bots/VM_Guard tests tools vm.py
      - name: Lint
        run: ruff check shared tests vm.py
      - name: Platform and bot tests
        run: python vm.py test-all

name: VM Platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    name: Platform validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install platform dev tools
        run: python -m pip install ruff
      - name: Compile platform
        run: python -m compileall -q shared tests tools/ci vm.py
      - name: Lint CI and repository validation code
        run: ruff check tools/ci --output-format=github
      - name: Validate Windows admin cutover scripts
        shell: powershell
        run: |
          $files = @(
            'tools/PREFLIGHT_ADMIN_RUNTIME_CUTOVER.ps1',
            'tools/CUTOVER_ADMIN_RUNTIME.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              exit 1
            }
          }
      - name: Platform tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  bot-core:
    name: Bot core tests (${{ matrix.bot }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        bot:
          - Universal_Search
          - VM_Guard
          - Admin_Command_Centre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot
        working-directory: bots/${{ matrix.bot }}
        run: python -m compileall -q .
      - name: Run bot tests
        working-directory: bots/${{ matrix.bot }}
        run: python -m unittest discover -s tests -p "test_*.py" -v

  smart-auto-poster-separation:
    name: Smart Auto Poster admin separation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile separation boundary
        working-directory: bots/Smart_Auto_Poster_V2
        run: python -m compileall -q smart_autoposter/settings.py tests/test_admin_separation.py
      - name: Test embedded admin remains disabled
        working-directory: bots/Smart_Auto_Poster_V2
        run: python -m unittest tests.test_admin_separation -v

  repository-health:
    name: Repository health
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository metadata
        run: python tools/ci/validate_repository.py

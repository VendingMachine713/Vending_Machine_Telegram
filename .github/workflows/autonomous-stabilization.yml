name: Autonomous Stabilization CI

on:
  push:
    branches:
      - automation/stabilization-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python compatibility and test suite
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        shell: pwsh
        run: python -m pip install --upgrade pip

      - name: Install available requirements
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter 'requirements*.txt' |
            Where-Object { $_.FullName -notmatch '\\.venv\\|\\venv\\|\\backups\\|\\runtime\\|\\state\\' }
          foreach ($f in $files) {
            Write-Host "Installing $($f.FullName)"
            python -m pip install -r $f.FullName
          }

      - name: Compile Python source
        shell: pwsh
        run: python -c "import compileall,sys; sys.exit(0 if compileall.compile_dir('.',quiet=1) else 1)"

      - name: Run unittest discovery
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-diagnostics
          path: |
            **/*.log
            **/test-results/**
          if-no-files-found: ignore
          retention-days: 7

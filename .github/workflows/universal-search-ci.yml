name: Universal Search CI

on:
  push:
    paths:
      - "bots/Universal_Search/**"
      - ".github/workflows/universal-search-ci.yml"
  pull_request:
    paths:
      - "bots/Universal_Search/**"
      - ".github/workflows/universal-search-ci.yml"

permissions:
  contents: read

jobs:
  universal-search-linux:
    name: Universal Search Linux / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: bots/Universal_Search/requirements.txt
      - name: Install dependencies
        working-directory: bots/Universal_Search
        run: python -m pip install -r requirements.txt
      - name: Compile Universal Search
        working-directory: bots/Universal_Search
        run: python -m compileall -q .
      - name: Run Universal Search tests
        working-directory: bots/Universal_Search
        run: python -m unittest discover -s tests -p "test_*.py" -v

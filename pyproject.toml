[project]
name = "vending-machine-telegram-platform"
version = "1.2.0"
description = "Shared platform and operational tooling for the Vending Machine Telegram ecosystem"
requires-python = ">=3.11"

[tool.vm]
architecture = "modular-bots-shared-core"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
  "backups",
  "logs",
  "diagnostics",
  "state",
  "releases",
  ".venv",
  "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
